name: iOS build

# Builds the Northcomm ScanSpec iOS app on a GitHub-hosted macOS runner
# (no Mac needed locally). Run it from the Actions tab: "iOS build" > Run workflow.
#
# WITHOUT signing secrets: it produces an UNSIGNED archive, which proves the app
# compiles end to end. This is what runs today, before Apple enrollment.
#
# WITH all 7 signing secrets (MANUAL signing: Distribution cert + App Store profile) (add these in the repo: Settings > Secrets and variables >
# Actions), it also signs, exports a .ipa, and uploads it to App Store Connect:
#   BUILD_CERTIFICATE_BASE64   - your Apple distribution cert (.p12), base64-encoded
#   P12_PASSWORD               - the password you set on that .p12
#   PROVISIONING_PROFILE_BASE64- the App Store provisioning profile, base64-encoded
#   APPSTORE_ISSUER_ID         - App Store Connect API key: Issuer ID
#   APPSTORE_KEY_ID            - App Store Connect API key: Key ID
#   APPSTORE_PRIVATE_KEY       - App Store Connect API key: the .p8 file contents
#   TEAM_ID                    - your 10-char Apple Developer Team ID
# NATIVE-BUILD.md explains where to get each one.

on:
  workflow_dispatch:

jobs:
  build:
    # Apple requires uploads built with Xcode 26 / iOS 26 SDK (since 2026-04-28).
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APP_VERSION: "1.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Bundle web assets into www/
        run: npm run build:web

      - name: Add + sync the iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Generate app icon + launch screen
        run: npx capacitor-assets generate --ios

      - name: Set home-screen name in Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'ScanSpec'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'ScanSpec'" "$PLIST"

      - name: Set camera permission string in Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Northcomm ScanSpec uses the camera to scan the QR label on a Northcomm product.'" \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSCameraUsageDescription 'Northcomm ScanSpec uses the camera to scan the QR label on a Northcomm product.'" \
            "$PLIST"

      - name: Light mode only (status bar stays readable on the white header)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Light" "$PLIST" 2>/dev/null ||           /usr/libexec/PlistBuddy -c "Set :UIUserInterfaceStyle Light" "$PLIST"

      - name: Declare export compliance (HTTPS only, no custom crypto)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null ||           /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: iPhone only (no iPad screenshots required)
        run: |
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "1";/g' ios/App/App.xcodeproj/project.pbxproj
          # Fail loudly if the template changed and the app is still universal.
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' ios/App/App.xcodeproj/project.pbxproj; then echo "still universal"; exit 1; fi
          grep -q 'TARGETED_DEVICE_FAMILY = "1";' ios/App/App.xcodeproj/project.pbxproj || { echo "device family not set"; exit 1; }

      - name: Add the app privacy manifest (PrivacyInfo.xcprivacy)
        run: |
          cp ios-extras/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            group = proj.main_group.find_subpath("App", false)
            unless group.files.any? { |f| f.path == "PrivacyInfo.xcprivacy" }
              ref = group.new_file("PrivacyInfo.xcprivacy")
              target.resources_build_phase.add_file_reference(ref)
            end
            proj.save
          '
          grep -q "PrivacyInfo.xcprivacy" ios/App/App.xcodeproj/project.pbxproj

      - name: Show Xcode version
        run: xcodebuild -version

      # (CocoaPods runs automatically inside `npx cap sync ios` above.)

      # ---- Detect whether ALL signing secrets are present ----
      - name: Check for signing secrets
        id: signing
        env:
          S1: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          S2: ${{ secrets.P12_PASSWORD }}
          S3: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          S4: ${{ secrets.APPSTORE_ISSUER_ID }}
          S5: ${{ secrets.APPSTORE_KEY_ID }}
          S6: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          S7: ${{ secrets.TEAM_ID }}
        run: |
          have=0
          for v in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7"; do [ -n "$v" ] && have=$((have+1)); done
          if [ "$have" -eq 7 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All 7 signing secrets found: will build a signed, uploadable build."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Found $have of 7 signing secrets: building an UNSIGNED archive (compile proof only)."
          fi

      # ---- Path A: no secrets yet -> prove it compiles ----
      - name: Build unsigned archive (compile proof)
        if: steps.signing.outputs.available == 'false'
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive \
            MARKETING_VERSION=$APP_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # ---- Path B: all secrets present -> MANUAL signing, export, upload ----
      - name: Import signing certificate into a temporary keychain
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identities in the keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install provisioning profile and read its name + UUID
        if: steps.signing.outputs.available == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID) for $APP_ID"
          # Fail early with a clear message if the wrong profile was supplied.
          [ "$APP_ID" = "$TEAM_ID.com.northcomm.scanspec" ] || { echo "Profile is for '$APP_ID', expected '$TEAM_ID.com.northcomm.scanspec'"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Set manual signing on the App target
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Set on the App target only (not on every package/pod), so
          # dependencies are not forced onto the app's provisioning profile.
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            end
            proj.save
          '
          grep -q "CODE_SIGN_STYLE = Manual" ios/App/App.xcodeproj/project.pbxproj

      - name: Build + sign archive
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive \
            MARKETING_VERSION=$APP_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      - name: Export .ipa
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.northcomm.scanspec</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          ls build/export/*.ipa

      - name: Upload to App Store Connect
        if: steps.signing.outputs.available == 'true'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove signing material from the runner
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf ~/private_keys "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: |
            build/App.xcarchive
            build/export/*.ipa
          if-no-files-found: warn
